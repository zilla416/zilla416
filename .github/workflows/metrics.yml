name: Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to the v3.34 commit: this action receives a token, so a moving tag
      # like @latest would let upstream changes run with it unreviewed.
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: zilla416
          filename: metrics.png
          # PNG so the dark background and colour overrides are baked in by the
          # renderer instead of depending on each viewer's browser and theme.
          config_output: png
          config_display: large
          # Overrides the classic template's blue/grey (see its style.css) with
          # GitHub-dark green. Contribution squares already come in green.
          extras_css: |
            html, body, body > svg { background: #0d1117; }
            svg { color: #8b949e; }
            h1, h2, h3 { color: #39d353; }
            .field svg { fill: #2ea043; }

          # Left out on purpose: community (followers, orgs can reveal employer),
          # activity (recent event feed), metadata (render timestamps).
          base: header, repositories

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_limit: 8
          # Indexed by rank: most used language gets the brightest green.
          plugin_languages_colors: "0:#7ee787, 1:#56d364, 2:#39d353, 3:#2ea043, 4:#26a641, 5:#238636, 6:#196c2e, 7:#0e4429"

          plugin_lines: yes

          # Not enabled: plugin_achievements. In v3.34 it queries GitHub's
          # Projects (classic) API, which GitHub has shut down, so it renders
          # "Unexpected error".

          # Not enabled: plugin_habits. Its commits-per-hour chart exposes your
          # timezone and daily schedule. config_timezone is also left unset (UTC)
          # for the same reason.
